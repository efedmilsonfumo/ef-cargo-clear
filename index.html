  function withTimeout(promise, ms = 8000) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout ao carregar dados.")), ms))
    ]);
  }

  function cleanupRealtime() {
    if (mensagensRealtimeChannel) {
      supabaseClient.removeChannel(mensagensRealtimeChannel);
      mensagensRealtimeChannel = null;
    }
    realtimeStarted = false;
  }

  async function refreshMessagesUI() {
    if (currentUserRole === "admin" || currentUserRole === "employee") {
      await loadInternalMessages();
    } else {
      await loadClientMessages();
      await refreshClientDashboard();
    }
  }

  function initMensagensRealtime() {
    if (realtimeStarted) return;

    mensagensRealtimeChannel = supabaseClient
      .channel("mensagens-live")
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "mensagens"
        },
        async (payload) => {
          const row = payload.new || payload.old || {};
          const rowEmail = String(row.cliente_email || "").toLowerCase();

          const isInternal = currentUserRole === "admin" || currentUserRole === "employee";
          const isClientRow = rowEmail && rowEmail === currentUserEmail.toLowerCase();

          if (isInternal || isClientRow) {
            await refreshMessagesUI();
          }
        }
      )
      .subscribe((status) => {
        console.log("Realtime mensagens:", status);
      });

    realtimeStarted = true;
  }

  async function sendPasswordReset() {
    const email = document.getElementById("forgot_email").value.trim();
    const msg = document.getElementById("forgotMsg");

    if (!email) {
      msg.textContent = "Digite o email.";
      msg.className = "message-err";
      return;
    }

    msg.textContent = "A enviar link...";
    msg.className = "small";

    try {
      const { error } = await withTimeout(
        supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname

        10000

      if (error) {
        msg.textContent = error.message;
        msg.className = "message-err";

      msg.className = "message-ok";

      msg.className = "message-err";

    if (!p1 || !p2) {

      msg.textContent = "As passwords não coincidem.";
      msg.className = "message-err";

    }

    msg.textContent = "A guardar nova password...";
    msg.className = "small";

        supabaseClient.auth.updateUser({ password: p1 }),
        10000

  function badgeEstado(estado) {
    const e = (estado || "").toLowerCase();
    if (e.includes("liberado") || e.includes("entregue")) return `<span class="badge green">${estado}</span>`;
    if (e.includes("análise") || e.includes("submetido") || e.includes("desembaraço")) return `<span class="badge blue">${estado}</span>`;
    return `<span class="badge amber">${estado || "Sem estado"}</span>`;
  }

  function formatDate(dateString) {
    if (!dateString) return "";
    const d = new Date(dateString);
    if (isNaN(d.getTime())) return dateString;
    return d.toLocaleDateString("pt-PT", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }) + " " + d.toLocaleTimeString("pt-PT", {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function formatMoney(value) {
    const n = Number(value || 0);
    return n.toLocaleString("pt-PT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function csvEscape(v) {
    const value = v == null ? "" : String(v);
    return `"${value.replace(/"/g, '""')}"`;
  }

  function downloadCSV(filename, headers, rows) {
    const csv = [
      headers.map(csvEscape).join(";"),
      ...rows.map(row => row.map(csvEscape).join(";"))
    ].join("\n");

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function registerClient() {
    const msg = document.getElementById("registerMsg");

    const nome = document.getElementById("reg_nome").value.trim();
    const nuit = document.getElementById("reg_nuit").value.trim();
    const contacto = document.getElementById("reg_contacto").value.trim();
    const email = document.getElementById("reg_email").value.trim().toLowerCase();
    const password = document.getElementById("reg_password").value;
    const password2 = document.getElementById("reg_password2").value;

    if (!nome || !email || !password) {
      msg.textContent = "Preencha nome, email e password.";
      msg.className = "message-err";
      return;
    }

    if (password.length < 6) {
      msg.textContent = "A password deve ter pelo menos 6 caracteres.";
      msg.className = "message-err";
      return;
    }

    if (password !== password2) {
      msg.textContent = "As passwords não coincidem.";
      msg.className = "message-err";
      return;
    }

    msg.textContent = "A criar conta...";
    msg.className = "small";

    try {
      const { data, error } = await withTimeout(
        supabaseClient.auth.signUp({ email, password }),
        12000
      );

      if (error) {
        msg.textContent = error.message;
        msg.className = "message-err";
        return;
      }

      const userId = data?.user?.id;
      if (!userId) {
        msg.textContent = "Conta criada, mas não foi possível obter o utilizador.";
        msg.className = "message-err";
        return;
      }

      const { error: clienteError } = await withTimeout(
        supabaseClient.from("clientes").insert({
          id: userId,
          nome,
          email,
          nuit,
          contacto
        }),
        10000
      );

      if (clienteError) {
        msg.textContent = clienteError.message;
        msg.className = "message-err";
        return;
      }

      msg.textContent = "Conta criada com sucesso. Já pode entrar no sistema.";
      msg.className = "message-ok";

      document.getElementById("reg_nome").value = "";
      document.getElementById("reg_nuit").value = "";
      document.getElementById("reg_contacto").value = "";
      document.getElementById("reg_email").value = "";
      document.getElementById("reg_password").value = "";
      document.getElementById("reg_password2").value = "";

      setTimeout(() => {
        showLogin();
        document.getElementById("email").value = email;
      }, 1200);
    } catch (e) {
      msg.textContent = e.message || "Erro ao criar conta.";
      msg.className = "message-err";
    }
  }

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const loginMsg = document.getElementById("loginMsg");

    if (!email || !password) {
      loginMsg.textContent = "Preencha email e password.";
      loginMsg.className = "message-err";
      return;
    }

    loginMsg.textContent = "A entrar...";
    loginMsg.className = "small";

    try {
      const { data, error } = await withTimeout(
        supabaseClient.auth.signInWithPassword({ email, password }),
        8000
      );

      if (error) {
        loginMsg.textContent = error.message;
        loginMsg.className = "message-err";
        return;
      }

      if (!data.user) {
        loginMsg.textContent = "Login não concluído.";
        loginMsg.className = "message-err";
        return;
      }

      await loadApp(data.user);
    } catch (e) {
      loginMsg.textContent = e.message;
      loginMsg.className = "message-err";
    }
  }

  async function loadApp(user) {
    currentUserEmail = (user.email || "").toLowerCase();
    cleanupRealtime();
    initMensagensRealtime();

    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("appView").classList.remove("hidden");

    await loadCompanyConfig();

    if (currentUserEmail === ADMIN_EMAIL.toLowerCase()) {
      currentUserRole = "admin";
      currentUserName = "Administrador";
      document.getElementById("welcome").textContent = "Edmilson Fumo • administrador";
      document.getElementById("internalView").classList.remove("hidden");
      document.getElementById("clientView").classList.add("hidden");
      applyInternalPermissions();
      setTimeout(async () => {
        await loadInternal();
        await loadInternalMessages();
      }, 100);
      return;
    }

    try {
      const { data: membro } = await withTimeout(
        supabaseClient.from("equipa").select("*").eq("email", currentUserEmail).eq("activo", true).maybeSingle(),
        8000
      );

      if (membro) {
        currentUserRole = "employee";
        currentUserName = membro.nome || "Funcionário";
        document.getElementById("welcome").textContent = `${membro.nome || "Funcionário"} • ${membro.nivel || "operador"}`;
        document.getElementById("internalView").classList.remove("hidden");
        document.getElementById("clientView").classList.add("hidden");
        applyInternalPermissions();
        setTimeout(async () => {
          await loadInternal();
          await loadInternalMessages();
        }, 100);
        return;
      }
    } catch (_) {}

    currentUserRole = "client";
    document.getElementById("clientView").classList.remove("hidden");
    document.getElementById("internalView").classList.add("hidden");

    try {
      const { data: cliente } = await withTimeout(
        supabaseClient.from("clientes").select("*").eq("email", currentUserEmail).maybeSingle(),
        8000
      );

      if (cliente) {
        currentUserName = cliente.nome || "";
        document.getElementById("welcome").textContent = `${cliente.nome} • cliente`;
        document.getElementById("cot_nome").value = cliente.nome || "";
        document.getElementById("cot_nuit").value = cliente.nuit || "";
        document.getElementById("cot_contacto").value = cliente.contacto || "";
        document.getElementById("cot_email").value = cliente.email || "";
      } else {
        document.getElementById("welcome").textContent = "Cliente • portal";
        document.getElementById("cot_email").value = currentUserEmail || "";
      }

      await loadClientCotacoes();
      await loadClientMessages();
      await refreshClientDashboard();
    } catch (_) {
      document.getElementById("welcome").textContent = "Cliente • portal";
    }
  }

  async function openSignedFromBucket(bucket, path) {
    if (!path) {
      alert("Documento não encontrado.");
      return;
    }

    try {
      const { data, error } = await withTimeout(
        supabaseClient.storage.from(bucket).createSignedUrl(path, 300),
        10000
      );

      if (error) {
        alert(error.message);
        return;
      }

      if (!data?.signedUrl) {
        alert("Não foi possível gerar o link.");
        return;
      }

      window.open(data.signedUrl, "_blank");
    } catch (e) {
      alert(e.message || "Erro ao abrir documento.");
    }
  }

  function gerarNumeroProcesso() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    const h = String(d.getHours()).padStart(2, "0");
    const min = String(d.getMinutes()).padStart(2, "0");
    return `EF-${y}${m}${day}-${h}${min}`;
  }

  async function atualizarEstado(processoId) {
    const select = document.getElementById("estado_" + processoId);
    const novoEstado = select.value;

    try {
      const { data: processo, error: processoReadError } = await withTimeout(
        supabaseClient.from("processos").select("historico").eq("id", processoId).single(),
        8000
      );

      if (processoReadError) {
        alert(processoReadError.message);
        return;
      }

      const historicoAtual = processo?.historico || "";
      const agora = new Date().toLocaleString("pt-PT");
      const novoHistorico = `${historicoAtual}\n• ${agora} - Estado alterado para: ${novoEstado}`.trim();

      const { error } = await withTimeout(
        supabaseClient
          .from("processos")
          .update({ estado: novoEstado, historico: novoHistorico })
          .eq("id", processoId),
        10000
      );

      if (error) {
        alert(error.message);
        return;
      }

      alert("Estado atualizado com sucesso");
      await loadInternal();
    } catch (e) {
      alert(e.message);
    }
  }

  async function salvarFinanceiro(processoId) {
    if (currentUserRole !== "admin") {
      alert("Sem permissão.");
      return;
    }

    const valorCobrado = Number(document.getElementById("cobrado_" + processoId).value || 0);
    const custos = Number(document.getElementById("custos_" + processoId).value || 0);
    const margem = valorCobrado - custos;

    try {
      const { data: processo, error: readError } = await withTimeout(
        supabaseClient.from("processos").select("historico").eq("id", processoId).single(),
        8000
      );

      if (readError) {
        alert(readError.message);
        return;
      }

      const historicoAtual = processo?.historico || "";
      const agora = new Date().toLocaleString("pt-PT");
      const novoHistorico = `${historicoAtual}\n• ${agora} - Financeiro atualizado. Cobrado: ${valorCobrado.toFixed(2)} | Custos: ${custos.toFixed(2)} | Margem: ${margem.toFixed(2)}`.trim();

      const { error } = await withTimeout(
        supabaseClient
          .from("processos")
          .update({
            valor_cobrado: valorCobrado,
            custos_processo: custos,
            margem_lucro: margem,
            historico: novoHistorico
          })
          .eq("id", processoId),
        10000
      );

      if (error) {
        alert(error.message);
        return;
      }

      alert("Financeiro actualizado");
      await loadInternal();
    } catch (e) {
      alert(e.message);
    }
  }

    if (!file) {
      alert("Escolha um ficheiro.");
      return;
    }

    try {
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const path = `${processoId}/${Date.now()}_${safeName}`;

      const { error: uploadError } = await withTimeout(
        supabaseClient.storage
          .from("processos")
          .upload(path, file, {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type || "application/octet-stream"
          }),
        15000
      );

      if (uploadError) {
        alert(uploadError.message);
        return;
      }

      const { error: insertError } = await withTimeout(
        supabaseClient.from("processos_documentos").insert({
          processo_id: processoId,
          nome_ficheiro: file.name,
          ficheiro_path: path,
          visivel_cliente: !!visibleInput?.checked,
          uploaded_by: currentUserRole === "admin" ? "admin" : "funcionario"
        }),
        10000
      );

      if (insertError) {
        alert(insertError.message);
        return;
      }

      const { data: processo } = await withTimeout(
        supabaseClient.from("processos").select("historico").eq("id", processoId).single(),
        8000
      );

      const historicoAtual = processo?.historico || "";
      const agora = new Date().toLocaleString("pt-PT");
      await withTimeout(
        supabaseClient.from("processos")
          .update({ historico: `${historicoAtual}\n• ${agora} - Documento anexado: ${file.name}`.trim() })
          .eq("id", processoId),
        10000
      );

      alert("Documento anexado com sucesso");
      input.value = "";
      await loadInternal();
    } catch (e) {
      alert(e.message || "Erro ao anexar documento.");
    }
  }

  async function converterCotacaoEmProcesso(cotacaoId) {
    if (!confirm("Converter esta cotação em processo?")) return;

    try {
      const { data: cotacao, error: cotacaoError } = await withTimeout(
        supabaseClient.from("pedidos_cotacao").select("*").eq("id", cotacaoId).single(),
        10000
      );

      if (cotacaoError || !cotacao) {
        alert(cotacaoError?.message || "Cotação não encontrada.");
        return;
      }

      if (cotacao.convertido_em_processo) {
        alert("Esta cotação já foi convertida.");
        return;
      }

      let cliente_id = null;

      if (cotacao.email) {
        const { data: clienteByEmail } = await withTimeout(
          supabaseClient.from("clientes").select("id").eq("email", cotacao.email).maybeSingle(),
          8000
        );

        if (clienteByEmail?.id) cliente_id = clienteByEmail.id;
      }

      const numeroProcesso = gerarNumeroProcesso();

      const payloadProcesso = {
        cliente_id,
        numero_processo: numeroProcesso,
        numero_factura: cotacao.numero_factura || "",
        importador_exportador: cotacao.nome_cliente || "",
        regime: cotacao.tipo_operacao || "",
        pais_origem: cotacao.origem || "",
        pais_destino: cotacao.destino || "",
        porto_fronteira: "",
        bl_awb_manifesto: "",
        prazo: null,
        estado: "Recebido",
        documentos_em_falta: cotacao.factura_path ? "" : "Factura em falta",
        valor_cobrado: 0,
        custos_processo: 0,
        margem_lucro: 0,
        historico: `• ${new Date().toLocaleString("pt-PT")} - Processo criado a partir da cotação ${cotacao.numero_factura || ""}. Mercadoria: ${cotacao.descricao_mercadoria || ""}`
      };

      const { data: novoProcesso, error: processoError } = await withTimeout(
        supabaseClient.from("processos").insert(payloadProcesso).select("id, numero_processo").single(),
        10000
      );

      if (processoError || !novoProcesso) {
        alert(processoError?.message || "Erro ao criar processo.");
        return;
      }

      const { error: updateError } = await withTimeout(
        supabaseClient
          .from("pedidos_cotacao")
          .update({
            convertido_em_processo: true,
            processo_id: novoProcesso.id,
            estado: "convertido em processo"
          })
          .eq("id", cotacaoId),
        10000
      );

      if (updateError) {
        alert(updateError.message);
        return;
      }

      alert(`Cotação convertida com sucesso. Processo criado: ${novoProcesso.numero_processo}`);
      await loadInternal();
      showInternalTab("processos");
    } catch (e) {
      alert(e.message || "Erro ao converter cotação em processo.");
    }
  }

  async function deleteCotacao(cotacaoId, facturaPath = null, ownerEmail = "") {
    const isAdminOrEmployee = currentUserRole === "admin" || currentUserRole === "employee";
    const isOwner = currentUserRole === "client" && ownerEmail.toLowerCase() === currentUserEmail.toLowerCase();

    if (!isAdminOrEmployee && !isOwner) {
      alert("Sem permissão para apagar esta cotação.");
      return;
    }

    if (!confirm("Apagar esta cotação?")) return;

    try {
      if (facturaPath) {
        await withTimeout(
          supabaseClient.storage.from("cotacoes").remove([facturaPath]),
          10000
        );
      }

      const { error } = await withTimeout(
        supabaseClient.from("pedidos_cotacao").delete().eq("id", cotacaoId),
        10000
      );

      if (error) {
        alert(error.message);
        return;

      alert("Cotação apagada com sucesso.");

      if (currentUserRole === "client") {
        await loadClientCotacoes();
      } else {
        await loadInternal();
      }
    } catch (e) {
      alert(e.message || "Erro ao apagar cotação.");
    }

  function getFilteredProcessos() {
    const g = (document.getElementById("globalSearch")?.value || "").trim().toLowerCase();
    const cliente = (document.getElementById("filterCliente")?.value || "").trim().toLowerCase();
    const factura = (document.getElementById("filterFactura")?.value || "").trim().toLowerCase();
    const estado = (document.getElementById("filterEstado")?.value || "").trim().toLowerCase();

    return processosCache.filter(p => {
      const blob = [
        p.numero_processo,
        p.numero_factura,
        p.importador_exportador,
        p.regime,
        p.estado,
        p.pais_origem,
        p.pais_destino,
        p.documentos_em_falta,
        p.historico
      ].join(" ").toLowerCase();

      const okGlobal = !g || blob.includes(g);
      const okCliente = !cliente || String(p.importador_exportador || "").toLowerCase().includes(cliente);
      const okFactura = !factura || String(p.numero_factura || "").toLowerCase().includes(factura);
      const okEstado = !estado || String(p.estado || "").toLowerCase() === estado;

      return okGlobal && okCliente && okFactura && okEstado;
    });
  }

      ["Processo","Factura","Cliente","Regime","Estado","Docs em falta","Valor cobrado","Custos","Margem"],
      rows

  async function loadInternal() {
    try {
      const [{ data: clientes }, { data: processos }, { data: cotacoes }, { data: docs }, { data: equipa }] = await Promise.all([
        withTimeout(supabaseClient.from("clientes").select("*").order("created_at", { ascending: false }), 8000),
        withTimeout(supabaseClient.from("processos").select("*").order("created_at", { ascending: false }), 8000),
        withTimeout(supabaseClient.from("pedidos_cotacao").select("*").order("created_at", { ascending: false }), 8000),
        withTimeout(supabaseClient.from("processos_documentos").select("*").order("created_at", { ascending: false }), 8000),
        withTimeout(supabaseClient.from("equipa").select("*").order("created_at", { ascending: false }), 8000)
      ]);

      clientesCache = clientes || [];
      processosCache = processos || [];
      cotacoesCache = cotacoes || [];
      docsCache = docs || [];
      equipaCache = equipa || [];

      const totalCobrado = processosCache.reduce((s, p) => s + Number(p.valor_cobrado || 0), 0);
      const totalCustos = processosCache.reduce((s, p) => s + Number(p.custos_processo || 0), 0);
      const totalMargem = processosCache.reduce((s, p) => s + Number(p.margem_lucro || 0), 0);
      const liberados = processosCache.filter(p => ["Liberado", "Entregue"].includes(p.estado)).length;

      document.getElementById("clientesCount").textContent = clientesCache.length;
      document.getElementById("processosCount").textContent = processosCache.length;
      document.getElementById("liberadosCount").textContent = liberados;
      document.getElementById("pendenciasCount").textContent =
        processosCache.filter(p => p.documentos_em_falta && p.documentos_em_falta.trim() !== "").length;
      document.getElementById("cotacoesCount").textContent = cotacoesCache.length;

      document.getElementById("valorCobradoTotal").textContent = formatMoney(totalCobrado);
      document.getElementById("custosTotal").textContent = formatMoney(totalCustos);
      document.getElementById("margemTotal").textContent = formatMoney(totalMargem);

      renderProcessosTable();
      renderCotacoesTable();
      renderFinanceiroTable();
      renderClientesGrid();
      renderEquipaGrid();
    } catch (e) {
      document.getElementById("welcome").textContent = "Painel interno • " + e.message;
    }
  }

  async function loadClientCotacoes() {
    const tbody = document.getElementById("clientCotacoesTable");
    if (!tbody) return;

    tbody.innerHTML = `<tr><td colspan="8">A carregar...</td></tr>`;

    try {
      const { data: userData } = await withTimeout(supabaseClient.auth.getUser(), 8000);
      const user = userData?.user;
      if (!user?.email) {
        tbody.innerHTML = `<tr><td colspan="8">Não foi possível identificar o utilizador.</td></tr>`;
        return;
      }

      const { data: cotacoes, error } = await withTimeout(
        supabaseClient.from("pedidos_cotacao").select("*").eq("email", user.email).order("created_at", { ascending: false }),
        10000
      );

      if (error) {
        tbody.innerHTML = `<tr><td colspan="8">${error.message}</td></tr>`;
        return;
      }

      clientCotacoesCache = cotacoes || [];

      if (!clientCotacoesCache.length) {
        tbody.innerHTML = `<tr><td colspan="8">Ainda não enviou nenhuma cotação.</td></tr>`;
        await refreshClientDashboard();
        return;
      }

      tbody.innerHTML = "";
      clientCotacoesCache.forEach(c => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${formatDate(c.created_at)}</td>
          <td>${c.numero_factura || ""}</td>
          <td>${c.tipo_operacao || ""}</td>
          <td>${c.origem || ""}</td>
          <td>${c.destino || ""}</td>
          <td>
            ${c.factura_path
              ? `<button class="btn-mini secondary" onclick="openFactura('${String(c.factura_path).replace(/'/g, "\\'")}')">Ver factura</button>`
              : '-'}
          </td>
          <td>${badgeEstado(c.estado || "recebido")}</td>
          <td>
            <button class="btn-mini danger" onclick="deleteCotacao('${String(c.id).replace(/'/g, "\\'")}', '${String(c.factura_path || "").replace(/'/g, "\\'")}', '${String(c.email || "").replace(/'/g, "\\'")}')">Apagar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      await refreshClientDashboard();
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="8">${e.message}</td></tr>`;
    }
  }

  async function buscarFactura() {
    const termo = document.getElementById("facturaSearch").value.trim();
    if (!termo) return;

    try {
      const { data: processos } = await withTimeout(
        supabaseClient.from("processos").select("*").ilike("numero_factura", `%${termo}%`).limit(1),
        8000
      );

      const p = processos && processos.length ? processos[0] : null;
      if (!p) {
        alert("Processo não encontrado.");
        return;
      }

      const { data: docs } = await withTimeout(
        supabaseClient
          .from("processos_documentos")
          .select("*")
          .eq("processo_id", p.id)
          .eq("visivel_cliente", true)
          .order("created_at", { ascending: false }),
        10000
      );

      document.getElementById("processoCard").classList.remove("hidden");
      document.getElementById("pcTitulo").textContent = "Factura " + (p.numero_factura || "");
      document.getElementById("pcSub").textContent = (p.numero_processo || "") + " • " + (p.importador_exportador || "");
      document.getElementById("pcEstado").innerHTML = badgeEstado(p.estado || "");
      document.getElementById("pcRegime").textContent = p.regime || "";
      document.getElementById("pcOrigem").textContent = p.pais_origem || "";
      document.getElementById("pcDestino").textContent = p.pais_destino || "";
      document.getElementById("pcPorto").textContent = p.porto_fronteira || "";
      document.getElementById("pcBl").textContent = p.bl_awb_manifesto || "";
      document.getElementById("pcPrazo").textContent = p.prazo || "";
      document.getElementById("pcDocs").textContent = p.documentos_em_falta || "Sem pendências";
      document.getElementById("pcHistorico").textContent = p.historico || "Sem histórico";

      const list = document.getElementById("pcDocsList");
      list.innerHTML = "";
      if (docs && docs.length) {
        docs.forEach(d => {
          const chip = document.createElement("span");
          chip.className = "doc-chip";
          chip.innerHTML = `
            <span>${d.nome_ficheiro || "Documento"}</span>
            <button class="btn-mini secondary" style="margin:0;padding:4px 8px;" onclick="openProcessoDocumento('${String(d.ficheiro_path).replace(/'/g, "\\'")}')">Abrir</button>
          `;
          list.appendChild(chip);
        });
      } else {
        list.innerHTML = `<span class="small">Sem documentos visíveis para o cliente.</span>`;
      }
    } catch (e) {
      alert(e.message);
    }
  }

  async function uploadFactura(file) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = `cotacoes/${Date.now()}_${safeName}`;

    const { error } = await withTimeout(
      supabaseClient.storage
        .from("cotacoes")
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type || "application/octet-stream"
        }),
      15000
    );

    if (error) throw error;
    return { path, filename: file.name };
  }

  async function submeterCotacao() {
    const msg = document.getElementById("cotacaoMsg");

    const nome_cliente = document.getElementById("cot_nome").value.trim();
    const nuit = document.getElementById("cot_nuit").value.trim();
    const contacto = document.getElementById("cot_contacto").value.trim();
    const email = document.getElementById("cot_email").value.trim();
    const tipo_operacao = document.getElementById("cot_tipo").value.trim();
    const origem = document.getElementById("cot_origem").value.trim();
    const destino = document.getElementById("cot_destino").value.trim();
    const descricao_mercadoria = document.getElementById("cot_mercadoria").value.trim();
    const numero_factura = document.getElementById("cot_factura").value.trim();
    const observacoes = document.getElementById("cot_obs").value.trim();
    const facturaFile = document.getElementById("cot_factura_file").files?.[0] || null;

    if (!nome_cliente || !tipo_operacao || !origem || !destino || !descricao_mercadoria) {
      msg.textContent = "Preencha os campos obrigatórios.";
      msg.className = "message-err";
      return;
    }

    msg.textContent = "A enviar pedido...";
    msg.className = "small";

    try {
      let factura_path = null;
      let factura_filename = null;

      if (facturaFile) {
        const uploaded = await uploadFactura(facturaFile);
        factura_path = uploaded.path;
        factura_filename = uploaded.filename;
      }

      const { error } = await withTimeout(
        supabaseClient.from("pedidos_cotacao").insert({
          nome_cliente,
          nuit,
          contacto,
          email,
          tipo_operacao,
          origem,
          destino,
          descricao_mercadoria,
          numero_factura,
          observacoes,
          factura_path,
          factura_filename,
          estado: "recebido"
        }),
        8000
      );

      if (error) {
        msg.textContent = error.message;
        msg.className = "message-err";
        return;
      }

      msg.textContent = "Pedido enviado com sucesso.";
      msg.className = "message-ok";

      await sendEmail(
        ADMIN_EMAIL,
        "Nova cotação recebida",
        `<div style="font-family:Arial,sans-serif">
          <h2>Nova cotação recebida</h2>
          <p><b>Cliente:</b> ${nome_cliente}</p>
          <p><b>Email:</b> ${email || "-"}</p>
          <p><b>Contacto:</b> ${contacto || "-"}</p>
          <p><b>Factura:</b> ${numero_factura || "-"}</p>
          <p><b>Tipo:</b> ${tipo_operacao}</p>
          <p><b>Origem:</b> ${origem}</p>
          <p><b>Destino:</b> ${destino}</p>
          <p><b>Mercadoria:</b> ${descricao_mercadoria}</p>
          <p><b>Observações:</b> ${observacoes || "-"}</p>
        </div>`
      );

      if (email) {
        await sendEmail(
          email,
          "Recebemos o seu pedido de cotação",
          `<div style="font-family:Arial,sans-serif">
            <h2>Pedido recebido com sucesso</h2>
            <p>Olá <b>${nome_cliente}</b>,</p>
            <p>Recebemos o seu pedido de cotação.</p>
            <p><b>Factura:</b> ${numero_factura || "-"}</p>
            <p><b>Tipo:</b> ${tipo_operacao}</p>
            <p><b>Origem:</b> ${origem}</p>
            <p><b>Destino:</b> ${destino}</p>
            <p>Vamos analisar e entrar em contacto em breve.</p>
            <br>
            <p>EF Cargo Clear</p>
          </div>`
        );

        await supabaseClient.from("mensagens").insert({
          cliente_email: email,
          remetente: "admin",
          mensagem: "Recebemos o seu pedido de cotação. A equipa vai responder em breve.",
          processo_numero: numero_factura || "",
          lido_cliente: false,
          lido_interno: true
        });
      }

      document.getElementById("cot_tipo").value = "";
      document.getElementById("cot_origem").value = "";
      document.getElementById("cot_destino").value = "";
      document.getElementById("cot_mercadoria").value = "";
      document.getElementById("cot_factura").value = "";
      document.getElementById("cot_obs").value = "";
      document.getElementById("cot_factura_file").value = "";
      document.getElementById("cot_factura_file_name").textContent = "Nenhum ficheiro selecionado.";

      await loadClientCotacoes();
      await loadClientMessages();
      await refreshClientDashboard();
    } catch (e) {
      msg.textContent = e.message || "Erro ao enviar pedido.";
      msg.className = "message-err";
    }
  }

  async function refreshClientDashboard() {
    try {
      const docsVisible = docsCache.filter(d => d.visivel_cliente === true).length;
      const lastProcess = processosCache[0] || null;
      const unread = mensagensCache.filter(m =>
        String(m.cliente_email || "").toLowerCase() === currentUserEmail.toLowerCase() &&
        m.remetente !== "cliente" &&
        !m.lido_cliente
      ).length;

      document.getElementById("clientDashCotacoes").textContent = clientCotacoesCache.length;
      document.getElementById("clientDashUnread").textContent = unread;
      document.getElementById("clientDashDocs").textContent = docsVisible;
      document.getElementById("clientDashEstado").textContent = lastProcess?.estado || "-";
    } catch (_) {}
  }

  async function loadProcessosForClientDashboard() {
    try {
      const { data } = await withTimeout(
        supabaseClient.from("processos").select("*").order("created_at", { ascending: false }),
        8000
      );
      processosCache = data || [];
    } catch (_) {}
  }

  async function loadDocsForClientDashboard() {
    try {
      const { data } = await withTimeout(
        supabaseClient.from("processos_documentos").select("*").eq("visivel_cliente", true).order("created_at", { ascending: false }),
        8000
      );
      docsCache = data || [];
    } catch (_) {}
  }

  async function loadInternalMessages() {
    const threadBox = document.getElementById("adminThreadList");
    const msgBox = document.getElementById("adminMessagesBox");
    if (!threadBox || !msgBox) return;

    try {
      const { data, error } = await withTimeout(
        supabaseClient.from("mensagens").select("*").order("created_at", { ascending: true }),
        10000
      );

      if (error) {
        threadBox.innerHTML = `<div class="empty-chat">${error.message}</div>`;
        msgBox.innerHTML = `<div class="empty-chat">${error.message}</div>`;
        return;
      }

      mensagensCache = data || [];
      renderInternalThreadList();
      updateUnreadBadges();

      const unread = mensagensCache.filter(m => m.remetente === "cliente" && !m.lido_interno);
      if (unread.length) {
        const ids = unread.map(x => x.id);

        const { error: updErr } = await supabaseClient
          .from("mensagens")
          .update({ lido_interno: true })
          .in("id", ids);

        if (!updErr) {
          mensagensCache = mensagensCache.map(m =>
            ids.includes(m.id) ? { ...m, lido_interno: true } : m
          );
          renderInternalThreadList();
          updateUnreadBadges();
        }
      }
    } catch (e) {
      threadBox.innerHTML = `<div class="empty-chat">${e.message}</div>`;
      msgBox.innerHTML = `<div class="empty-chat">${e.message}</div>`;
    }
  }

  function renderInternalThreadList() {
    const threadBox = document.getElementById("adminThreadList");
    const msgBox = document.getElementById("adminMessagesBox");
    if (!threadBox || !msgBox) return;

    if (!mensagensCache.length) {
      threadBox.innerHTML = `<div class="empty-chat">Sem conversas.</div>`;
      msgBox.innerHTML = `<div class="empty-chat">Selecione uma conversa.</div>`;
      currentSelectedThread = "";
      return;
    }

    const grouped = {};
    mensagensCache.forEach(m => {
      const key = String(m.cliente_email || "").toLowerCase();
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(m);
    });

    const threads = Object.entries(grouped)
      .map(([email, rows]) => {
        const last = rows[rows.length - 1];
        const unread = rows.filter(r => r.remetente === "cliente" && !r.lido_interno).length;
        return { email, rows, last, unread };
      })
      .sort((a, b) => new Date(b.last.created_at) - new Date(a.last.created_at));

    if (!currentSelectedThread && threads.length) {
      currentSelectedThread = threads[0].email;
    }

    threadBox.innerHTML = threads.map(t => `
      <div class="chat-thread-item ${currentSelectedThread === t.email ? "active" : ""}" onclick="selectInternalThread('${t.email}')">
        <div class="chat-thread-name">
          ${escapeHtml(t.email)}
          ${t.unread ? `<span class="unread-dot">${t.unread}</span>` : ""}
        </div>
        <div class="chat-thread-meta">
          ${escapeHtml(t.last?.mensagem || "")}
        </div>
        <div class="chat-thread-meta" style="margin-top:6px;">
          ${formatDate(t.last?.created_at)}
        </div>
      </div>
    `).join("");

    renderInternalMessages();
  }

  function selectInternalThread(email) {
    currentSelectedThread = String(email || "").toLowerCase();
    renderInternalThreadList();
  }

  function renderInternalMessages() {
    const msgBox = document.getElementById("adminMessagesBox");
    if (!msgBox) return;

    const rows = mensagensCache.filter(m => String(m.cliente_email || "").toLowerCase() === currentSelectedThread);

    if (!rows.length) {
      msgBox.innerHTML = `<div class="empty-chat">Selecione uma conversa.</div>`;
      return;
    }

    msgBox.innerHTML = rows.map(m => `
      <div class="chat-bubble ${m.remetente === "admin" ? "mine" : "other"}">
        <div>${escapeHtml(m.mensagem || "")}</div>
        <div class="chat-meta">
          ${m.processo_numero || "-"} • ${m.remetente} • ${formatDate(m.created_at)}
        </div>
      </div>
    `).join("");

    msgBox.scrollTop = msgBox.scrollHeight;
  }

  async function sendAdminMessage() {
    const text = document.getElementById("adminMessageText").value.trim();

    if (!currentSelectedThread) {
      alert("Selecione uma conversa.");
      return;
    }

    if (!text) {
      alert("Digite a mensagem.");
      return;
    }

    try {
      const { error } = await withTimeout(
        supabaseClient.from("mensagens").insert({
          cliente_email: currentSelectedThread,
          remetente: "admin",
          mensagem: text,
          processo_numero: "",
          lido_cliente: false,
          lido_interno: true
        }),
        10000
      );

      if (error) {
        alert(error.message);
        return;
      }

      document.getElementById("adminMessageText").value = "";
      await loadInternalMessages();
    } catch (e) {
      alert(e.message || "Erro ao enviar mensagem.");
    }
  }

  async function loadClientMessages() {
    const box = document.getElementById("clientMessagesBox");
    if (!box) return;

    try {
      const { data, error } = await withTimeout(
        supabaseClient.from("mensagens").select("*").eq("cliente_email", currentUserEmail).order("created_at", { ascending: true }),
        10000
      );

      if (error) {
        box.innerHTML = `<div class="empty-chat">${error.message}</div>`;
        return;
      }

      mensagensCache = data || [];

      if (!mensagensCache.length) {
        box.innerHTML = `<div class="empty-chat">Sem mensagens ainda.</div>`;
        updateUnreadBadges();
        return;
      }

      box.innerHTML = mensagensCache.map(m => `
        <div class="chat-bubble ${m.remetente === "cliente" ? "mine" : "other"}">
          <div>${escapeHtml(m.mensagem || "")}</div>
          <div class="chat-meta">
            ${m.processo_numero || "-"} • ${m.remetente} • ${formatDate(m.created_at)}
          </div>
        </div>
      `).join("");

      box.scrollTop = box.scrollHeight;
      updateUnreadBadges();
    } catch (e) {
      box.innerHTML = `<div class="empty-chat">${e.message}</div>`;
    }
  }

  async function markClientMessagesRead() {
    try {
      const { data } = await withTimeout(
        supabaseClient
          .from("mensagens")
          .select("id")
          .eq("cliente_email", currentUserEmail)
          .eq("lido_cliente", false)
          .neq("remetente", "cliente"),
        10000
      );

      if (data?.length) {
        const ids = data.map(x => x.id);

        const { error } = await supabaseClient
          .from("mensagens")
          .update({ lido_cliente: true })
          .in("id", ids);

        if (!error) {
          await loadClientMessages();
          await refreshClientDashboard();
        }
      }
    } catch (_) {}
  }

  async function sendClientMessage() {
    const text = document.getElementById("clientMessageText").value.trim();
    if (!text) {
      alert("Digite a mensagem.");
      return;
    }

    try {
      const { error } = await withTimeout(
        supabaseClient.from("mensagens").insert({
          cliente_email: currentUserEmail,
          remetente: "cliente",
          mensagem: text,
          processo_numero: "",
          lido_cliente: true,
          lido_interno: false
        }),
        10000
      );

      if (error) {
        alert(error.message);
        return;
      }

      document.getElementById("clientMessageText").value = "";
      await loadClientMessages();
    } catch (e) {
      alert(e.message || "Erro ao enviar mensagem.");
    }
  }

  function updateUnreadBadges() {
    const allRows = Array.isArray(mensagensCache) ? mensagensCache : [];

    const clientUnread = allRows.filter(m =>
      String(m.cliente_email || "").toLowerCase() === currentUserEmail.toLowerCase() &&
      m.remetente !== "cliente" &&
      !m.lido_cliente
    ).length;

    const internalUnread = allRows.filter(m =>
      m.remetente === "cliente" &&
      !m.lido_interno
    ).length;

    const clientEl = document.getElementById("clientUnreadBadge");
    const internalEl = document.getElementById("internalUnreadBadge");
    const dashUnread = document.getElementById("clientDashUnread");

    if (clientEl) {
      clientEl.textContent = clientUnread;
      clientEl.classList.toggle("hidden", clientUnread === 0);
    }

    if (internalEl) {
      internalEl.textContent = internalUnread;
      internalEl.classList.toggle("hidden", internalUnread === 0);
    }

    if (dashUnread) {
      dashUnread.textContent = clientUnread;
    }
  }

  function escapeHtml(text) {
    return String(text || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  window.addEventListener("load", async () => {
    try {
      const { data } = await withTimeout(supabaseClient.auth.getSession(), 8000);
      if (data.session?.user) {
        await loadApp(data.session.user);
        await loadProcessosForClientDashboard();
        await loadDocsForClientDashboard();
        await refreshClientDashboard();
      }
    } catch (_) {}
  });
</script>
