<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EF Cargo Clear</title>

  <!-- SUPABASE (FIXED) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body style="font-family: Arial; padding: 40px;">

<h1>EF Cargo Clear</h1>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="login()">Entrar</button>

<p id="msg"></p>

<script>

// TESTE JS
alert("JS CARREGOU");

// CONFIG
const SUPABASE_URL = "https://fefkyzutcouoklbiwybs.supabase.co";
const SUPABASE_KEY = "sb_publishable_uOowmqEhVdq8h0uzagYPEA_DXXpGOgA";

// 🔥 CORREÇÃO DEFINITIVA
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login() {
  alert("CLICOU NO BOTÃO");

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert("ERRO: " + error.message);
    document.getElementById("msg").innerText = error.message;
    return;
  }

  alert("LOGIN FUNCIONOU");

  document.getElementById("msg").innerText = "Login OK";
}

</script>

</body>
</html>
