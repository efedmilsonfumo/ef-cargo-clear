<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EF Cargo Clear</title>

  <!-- SUPABASE (VERSÃO CORRETA) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

</head>
<body style="font-family: Arial; padding: 40px;">

<h1>EF Cargo Clear</h1>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="login()">Entrar</button>

<p id="msg"></p>

<script>

alert("JS CARREGOU"); // TESTE 1

const SUPABASE_URL = "https://fefkyzutcouoklbiwybs.supabase.co";
const SUPABASE_KEY = "sb_publishable_uOowmqEhVdq8h0uzagYPEA_DXXpGOgA";

// 🔥 CRIA CLIENTE
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function login() {
  alert("CLICOU NO BOTÃO"); // TESTE 2

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert("ERRO: " + error.message);
    document.getElementById("msg").innerText = error.message;
    return;
  }

  alert("LOGIN FUNCIONOU"); // TESTE 3

  document.getElementById("msg").innerText = "Login OK";
}

</script>

</body>
</html>
