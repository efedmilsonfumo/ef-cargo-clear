<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EF Cargo Clear</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f4f6f8;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#BE001A;
      --primary-dark:#980015;
      --primary-soft:#fff3f5;
      --success-bg:#dcfce7;
      --success-text:#166534;
      --warn-bg:#fff3cd;
      --warn-text:#856404;
      --info-bg:#e0f2fe;
      --info-text:#075985;
      --danger:#b91c1c;
      --shadow:0 18px 40px rgba(15,23,42,.08);
      --shadow-soft:0 10px 24px rgba(15,23,42,.05);
      --radius:24px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:
        radial-gradient(circle at top right, rgba(190,0,26,.06), transparent 22%),
        radial-gradient(circle at bottom left, rgba(190,0,26,.05), transparent 18%),
        linear-gradient(180deg,#fafafa 0%, #f2f4f7 100%);
      color:var(--text);
    }

    .wrap{max-width:1480px;margin:0 auto;padding:22px}
    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px;
      margin-bottom:18px;
      border:1px solid rgba(229,231,235,.95);
    }

    .hero-card{position:relative;overflow:hidden}
    .hero-card::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:6px;
      background:linear-gradient(90deg,var(--primary) 0%, #d91b35 45%, #f0b7bf 100%);
    }

    .login-shell{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:
        radial-gradient(circle at top right, rgba(190,0,26,.08), transparent 25%),
        radial-gradient(circle at bottom left, rgba(190,0,26,.06), transparent 20%),
        linear-gradient(180deg,#fafafa 0%, #f2f2f2 100%);
    }

    .login-card{
      width:100%;
      max-width:640px;
      background:#fff;
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:32px;
      border:1px solid rgba(229,231,235,.85);
      position:relative;
      overflow:hidden;
    }

    .login-card::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:7px;
      background:linear-gradient(90deg,var(--primary) 0%, #d51b33 45%, #f4c1c8 100%);
    }

    .pill{
      display:inline-block;
      padding:8px 13px;
      font-size:12px;
      border-radius:999px;
      background:rgba(190,0,26,.08);
      color:var(--primary);
      margin-bottom:18px;
      font-weight:700;
      letter-spacing:.02em;
    }

    .login-title{
      margin:0 0 10px;
      font-size:38px;
      line-height:1;
      color:var(--primary);
      letter-spacing:-0.03em;
    }

    .login-sub{
      margin:0 0 24px;
      color:var(--muted);
      font-size:15px;
      line-height:1.5;
      max-width:520px;
    }

    .grid{display:grid;gap:18px}
    .grid-5{grid-template-columns:repeat(5,1fr)}
    .grid-4{grid-template-columns:repeat(4,1fr)}
    .grid-3{grid-template-columns:repeat(3,1fr)}
    .grid-2{grid-template-columns:repeat(2,1fr)}

    .row{display:flex;gap:14px;flex-wrap:wrap}
    .row > *{flex:1;min-width:220px}

    label{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin:0 0 8px;
      font-weight:700;
    }

    input, select, textarea{
      width:100%;
      border:1px solid #d7dee8;
      background:#fff;
      border-radius:14px;
      padding:14px 15px;
      font-size:15px;
      outline:none;
      transition:border-color .2s, box-shadow .2s, background .2s;
    }

    input:focus, select:focus, textarea:focus{
      border-color:rgba(190,0,26,.45);
      box-shadow:0 0 0 4px rgba(190,0,26,.08);
      background:#fff;
    }

    textarea{min-height:110px;resize:vertical}

    .btn{
      border:none;
      background:linear-gradient(180deg,var(--primary) 0%, var(--primary-dark) 100%);
      color:#fff;
      padding:14px 18px;
      border-radius:16px;
      cursor:pointer;
      font-size:15px;
      min-height:50px;
      box-shadow:0 8px 18px rgba(190,0,26,.18);
      font-weight:700;
    }

    .btn:hover{background:linear-gradient(180deg,#c6001b 0%, #930015 100%)}
    .btn-outline{
      background:#fff;
      color:var(--text);
      border:1px solid #d6d6d6;
      box-shadow:none;
    }
    .btn-outline:hover{background:#fafafa;color:var(--primary)}

    .btn-mini{
      border:none;
      background:var(--primary);
      color:#fff;
      padding:8px 12px;
      border-radius:10px;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
      margin-right:6px;
      margin-bottom:6px;
    }

    .btn-mini:hover{background:var(--primary-dark)}
    .btn-mini.secondary{background:#374151}
    .btn-mini.secondary:hover{background:#1f2937}
    .btn-mini.info{background:#0369a1}
    .btn-mini.info:hover{background:#075985}
    .btn-mini.green{background:#15803d}
    .btn-mini.green:hover{background:#166534}
    .btn-mini.danger{background:#b91c1c}
    .btn-mini.danger:hover{background:#991b1b}

    .link-btn{
      background:none;
      border:none;
      padding:0;
      color:var(--primary);
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:18px;
      flex-wrap:wrap;
    }

    .brand{display:flex;flex-direction:column;gap:10px}
    .brand-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

    .brand-logo-wrap{
      width:64px;
      height:64px;
      border-radius:18px;
      background:#fff;
      border:1px solid rgba(229,231,235,.95);
      box-shadow:0 12px 24px rgba(190,0,26,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      flex-shrink:0;
    }

    .brand-logo{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#fff;
      display:none;
      padding:6px;
    }

    .brand-badge{
      width:58px;
      height:58px;
      border-radius:18px;
      background:linear-gradient(180deg,var(--primary) 0%, var(--primary-dark) 100%);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:28px;
      box-shadow:0 12px 24px rgba(190,0,26,.18);
      flex-shrink:0;
    }

    .brand h1{
      margin:0;
      font-size:34px;
      line-height:1.05;
      color:var(--primary);
      letter-spacing:-0.03em;
    }

    .brand p{
      margin:0;
      color:#4A4A4A;
      font-size:13px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      line-height:1.35;
    }

    .welcome-line{color:var(--muted);font-size:14px;margin-top:2px}
    .small{font-size:13px;color:var(--muted);line-height:1.45}
    .message-ok{color:#166534;font-size:14px;font-weight:600}
    .message-err{color:#b91c1c;font-size:14px;font-weight:600}
    .hidden{display:none}

    .admin-shell{
      display:grid;
      grid-template-columns:280px 1fr;
      gap:18px;
      align-items:start;
    }

    .sidebar{
      position:sticky;
      top:16px;
      background:linear-gradient(180deg,#ffffff 0%, #fcfcfc 100%);
      border:1px solid rgba(229,231,235,.95);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:20px;
    }

    .sidebar-title{
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--muted);
      margin-bottom:14px;
      font-weight:800;
    }

    .sidebar-menu{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .sidebar-btn{
      width:100%;
      text-align:left;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      padding:14px 16px;
      border-radius:16px;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
      position:relative;
    }

    .sidebar-btn:hover{
      border-color:rgba(190,0,26,.25);
      color:var(--primary);
      background:#fffdfd;
    }

    .sidebar-btn.active{
      background:linear-gradient(180deg,var(--primary) 0%, var(--primary-dark) 100%);
      color:#fff;
      border-color:var(--primary);
    }

    .badge-dot{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:20px;
      height:20px;
      padding:0 6px;
      border-radius:999px;
      background:#ef4444;
      color:#fff;
      font-size:11px;
      font-weight:700;
      margin-left:8px;
    }

    .kpi{
      padding:22px;
      border-radius:22px;
      background:linear-gradient(180deg,#ffffff 0%, #fcfcfc 100%);
      box-shadow:var(--shadow-soft);
      border:1px solid rgba(229,231,235,.9);
      position:relative;
      overflow:hidden;
    }

    .kpi::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:5px;
      background:linear-gradient(180deg,var(--primary) 0%, #e56474 100%);
    }

    .kpi-title{color:var(--muted);font-size:14px;margin-bottom:10px;font-weight:700}
    .kpi-value{font-size:34px;font-weight:800;color:var(--primary);letter-spacing:-0.03em}

    .tabs{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .tab-btn{
      background:#fff;
      border:1px solid var(--line);
      color:var(--text);
      padding:12px 16px;
      border-radius:14px;
      cursor:pointer;
      font-size:14px;
      font-weight:700;
      position:relative;
    }

    .tab-btn:hover{border-color:rgba(190,0,26,.25);color:var(--primary)}
    .tab-btn.active{
      background:linear-gradient(180deg,var(--primary) 0%, var(--primary-dark) 100%);
      color:#fff;
      border-color:var(--primary);
    }

    .tab-content.hidden{display:none}
    .section-title{font-size:24px;font-weight:800;margin:0 0 10px;color:#232323;letter-spacing:-0.02em}
    .section-sub{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .panel-actions{display:flex;gap:8px;flex-wrap:wrap}

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
    }

    thead tr{background:#fafafa}

    th,td{
      text-align:left;
      padding:16px 12px;
      border-bottom:1px solid var(--line);
      font-size:15px;
      vertical-align:top;
    }

    th{
      color:#374151;
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    tbody tr:hover{background:#fcfcfc}

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      white-space:nowrap;
      font-weight:700;
    }

    .amber{background:var(--warn-bg);color:var(--warn-text)}
    .green{background:var(--success-bg);color:var(--success-text)}
    .blue{background:var(--info-bg);color:var(--info-text)}

    .muted-box{
      background:linear-gradient(180deg,#fafafa 0%, #f7f7f7 100%);
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .detail-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px 26px;
    }

    .detail-item strong{
      display:block;
      margin-bottom:6px;
      color:#1f2937;
      font-size:14px;
    }

    .history-box{
      background:#fafafa;
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      white-space:pre-wrap;
      line-height:1.5;
      font-size:14px;
    }

    .doc-list{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .doc-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      background:#f3f4f6;
      border:1px solid #e5e7eb;
      font-size:12px;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:end;
      margin-bottom:16px;
    }

    .toolbar .field{
      min-width:180px;
      flex:1;
    }

    .table-scroll{overflow:auto}
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

    .client-card{
      padding:18px;
      border:1px solid var(--line);
      border-radius:20px;
      background:linear-gradient(180deg,#fff 0%, #fcfcfc 100%);
      box-shadow:var(--shadow-soft);
    }

    .client-name{
      font-size:18px;
      font-weight:800;
      margin:0 0 8px;
      color:#111827;
    }

    .client-meta{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px 16px;
      margin-top:12px;
    }

    .client-meta div{font-size:14px;color:#374151}
    .client-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.45);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:1000;
    }

    .modal{
      width:100%;
      max-width:760px;
      background:#fff;
      border-radius:24px;
      box-shadow:0 24px 60px rgba(15,23,42,.18);
      border:1px solid rgba(229,231,235,.95);
      padding:24px;
      max-height:90vh;
      overflow:auto;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }

    .status-steps{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:12px;
      margin-top:18px;
    }

    .status-step{
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      background:#fff;
      text-align:center;
      font-size:13px;
      color:var(--muted);
      font-weight:700;
    }

    .status-step.done{
      background:var(--primary-soft);
      border-color:rgba(190,0,26,.22);
      color:var(--primary);
    }

    .message-list{
      display:flex;
      flex-direction:column;
      gap:12px;
      max-height:460px;
      overflow:auto;
      padding-right:4px;
    }

    .message-item{
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      background:#fff;
    }

    .message-item.mine{
      background:#fff5f6;
      border-color:#f5c8d0;
    }

    .message-head{
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:8px;
      font-size:12px;
      color:var(--muted);
      font-weight:700;
    }

    .message-body{
      font-size:14px;
      line-height:1.5;
      white-space:pre-wrap;
    }

    .contact-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .map-frame{
      width:100%;
      min-height:320px;
      border:0;
      border-radius:18px;
      background:#f3f4f6;
    }

    .mini-kpis{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
    }

    .mini-card{
      border:1px solid var(--line);
      border-radius:20px;
      padding:18px;
      background:linear-gradient(180deg,#fff 0%, #fcfcfc 100%);
      box-shadow:var(--shadow-soft);
    }

    .mini-card .label{
      font-size:13px;
      color:var(--muted);
      margin-bottom:8px;
      font-weight:700;
    }

    .mini-card .value{
      font-size:28px;
      color:var(--primary);
      font-weight:800;
    }

    .empty-state{
      padding:24px;
      border:1px dashed #d6d6d6;
      border-radius:18px;
      color:var(--muted);
      text-align:center;
      background:#fcfcfc;
    }

    .no-print{display:block}
    hr{border:none;border-top:1px solid var(--line)}

    @media (max-width:1180px){
      .admin-shell{grid-template-columns:1fr}
      .sidebar{position:static}
      .contact-grid{grid-template-columns:1fr}
    }

    @media (max-width:1100px){
      .grid-5,.grid-4{grid-template-columns:repeat(2,1fr)}
      .grid-3,.detail-grid,.grid-2,.stat-row,.client-meta,.status-steps,.mini-kpis{grid-template-columns:1fr}
    }

    @media (max-width:640px){
      .wrap{padding:14px}
      .card,.kpi,.sidebar,.client-card,.mini-card{padding:18px}
      .login-card{padding:24px}
      .login-title{font-size:32px}
      .grid-5,.grid-4{grid-template-columns:1fr}
      .brand h1{font-size:28px}
      .brand-badge,.brand-logo-wrap{width:48px;height:48px;font-size:22px}
      th,td{padding:14px 8px;font-size:14px}
    }
  </style>
</head>
<body>
  <!-- O resto do ficheiro foi guardado num arquivo para download -->
</body>
</html>
